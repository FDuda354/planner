version: "1.0"
linter: jetbrains/qodana-jvm:latest
projectJDK: "25"

profile:
  base:
    name: qodana.starter
  inspections:
    - inspection: JvmCoverageInspection
      options:
        classThreshold: 0
        methodThreshold: 0
        warnMissingCoverage: false

exclude:
  - name: All
    paths:
      - frontend
      - backend/build
      - backend/src/main/resources/db/migration
  - name: HardcodedPasswords
    paths:
      - backend/src/main/resources/application.yml
  - name: JvmTaintAnalysis
    paths:
      - backend/src/main/java/pl/dudios/planner/exception/handler/DefaultExceptionHandler.java

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
  testCoverageThresholds:
    total: 60
