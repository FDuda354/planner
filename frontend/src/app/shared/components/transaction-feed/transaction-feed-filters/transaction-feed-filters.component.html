<div class="flex flex-row flex-wrap items-center gap-8">
  <ui-type-filter name="feed-type" [value]="feed.filters().type" [countOf]="countOfType" (changed)="feed.selectType($event)"/>
  <ui-member-picker name="feed-member" label="Osoba dokonująca transakcji" noneLabel="Wszyscy" [value]="feed.filters().memberId"
                    [members]="householdStore.members()" (changed)="feed.selectMember($event)"/>
  <ui-shared-filter [value]="feed.filters().shared" (changed)="feed.selectShared($event)"/>
  <p-select class="feed-filters__category" [formField]="itemForm.item" [options]="itemGroups()" [group]="true" optionLabel="label"
            optionValue="value" placeholder="Wszystkie kategorie" ariaLabel="Kategoria" [showClear]="true" appendTo="body"
            scrollHeight="320px" (onChange)="feed.selectItem($event.value)">
    <ng-template #group let-itemGroup>
      <span class="overline">{{ itemGroup.label }}</span>
    </ng-template>
    <ng-template #item let-option>
      <ng-container [ngTemplateOutlet]="itemOption" [ngTemplateOutletContext]="{$implicit: option.item}"/>
    </ng-template>
    <ng-template #selectedItem let-option>
      @if (option) {
        <ng-container [ngTemplateOutlet]="itemOption" [ngTemplateOutletContext]="{$implicit: option.item}"/>
      }
    </ng-template>
  </p-select>
  @if (feed.isFiltered()) {
    <button pButton type="button" variant="text" severity="secondary" (click)="feed.clearFilters()">Wyczyść filtry</button>
  }
</div>

<ng-template #itemOption let-budgetItem>
  <span class="flex flex-row items-center gap-8 feed-filters__option">
    <i [class]="budgetItem.icon | iconClass" [style.color]="budgetItem.color" aria-hidden="true"></i>
    {{ budgetItem.name }}
  </span>
</ng-template>
