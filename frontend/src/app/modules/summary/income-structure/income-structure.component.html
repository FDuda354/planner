<section class="panel income">
  <div class="panel__header">
    <div>
      <h2 class="panel__title">Skąd pieniądze</h2>
      <p class="panel__subtitle">Struktura wpływów w {{ store.year() }}</p>
    </div>
  </div>

  @if (store.incomeSources().length === 0) {
    <ui-empty-state icon="pi-wallet" title="Brak wpływów w tym roku"/>
  } @else {
    <div class="income__chart">
      <canvas [uiChart]="chart()"></canvas>
    </div>
    <div class="flex flex-col gap-8">
      @for (source of store.incomeSources(); track source.item.id) {
        <div class="flex flex-row items-center gap-12">
          <ui-item-icon [icon]="source.item.icon" [color]="source.item.color" size="sm"/>
          <span class="income__name">{{ source.item.name }}</span>
          <span class="muted income__share">{{ source.share | percent }}</span>
          <span class="amount">{{ source.total | money: 'whole' }}</span>
        </div>
      }
    </div>
  }

  <p-divider/>

  <app-member-year-totals title="Kto ile wpłacił do budżetu w tym roku"
                          [totals]="store.memberIncomeTotals()"
                          sharedLabel="Otrzymane wspólnie"
                          [sharedAmount]="store.sharedIncome()"/>

  <p-divider/>

  <app-member-year-totals title="Kto ile wydał na siebie w tym roku"
                          [totals]="store.memberTotals()"
                          sharedLabel="Dobro wspólne"
                          [sharedAmount]="store.sharedExpenses()"/>
</section>
