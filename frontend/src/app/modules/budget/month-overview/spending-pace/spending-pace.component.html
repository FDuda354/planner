<section class="panel pace">
  <div class="panel__header">
    <div>
      <h2 class="panel__title">Tempo wydatków</h2>
      <p class="panel__subtitle">Wydatki narastająco, dzień po dniu</p>
    </div>
    <div class="flex flex-row gap-16 pace__legend">
      <span class="pace__legend-item"><span class="pace__swatch pace__swatch--current"></span>{{ currentLabel() }}</span>
      @if (store.hasPreviousMonthExpenses()) {
        <span class="pace__legend-item"><span class="pace__swatch pace__swatch--previous"></span>{{ store.previousMonthName() }}</span>
      }
    </div>
  </div>
  <div class="pace__chart">
    <canvas [uiChart]="chart()"></canvas>
  </div>
</section>
