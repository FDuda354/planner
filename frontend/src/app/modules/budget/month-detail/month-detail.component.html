<div class="flex flex-row items-center justify-between gap-12 month-detail__nav">
  <a pButton variant="text" severity="secondary" [routerLink]="AppRoute.HISTORY" class="month-detail__back">
    <i class="pi pi-arrow-left" aria-hidden="true"></i>
    Wszystkie miesiące
  </a>
  <div class="flex flex-row items-center gap-8">
    <a pButton variant="outlined" severity="secondary" [routerLink]="previousRoute()" class="month-detail__step" [attr.aria-label]="previousLabel()">
      <i class="pi pi-chevron-left" aria-hidden="true"></i>
      <span class="month-detail__step-label">{{ previousLabel() }}</span>
    </a>
    <a pButton variant="outlined" severity="secondary" [routerLink]="nextRoute()" class="month-detail__step" [attr.aria-label]="nextLabel()">
      <span class="month-detail__step-label">{{ nextLabel() }}</span>
      <i class="pi pi-chevron-right" aria-hidden="true"></i>
    </a>
  </div>
</div>

<app-month-overview [month]="month()"/>
