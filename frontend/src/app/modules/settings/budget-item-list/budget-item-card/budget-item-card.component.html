<div class="item-card">
  <button type="button" class="flex flex-row items-center gap-12 item-card__main" (click)="edit()">
    <ui-item-icon [icon]="item().icon" [color]="item().color"/>
    <span class="flex flex-col item-card__text">
      <span class="item-card__name">{{ item().name }}</span>
      @if (meta(); as meta) {
        <span class="item-card__meta">{{ meta }}</span>
      }
    </span>
    <i class="pi pi-pencil item-card__edit" aria-hidden="true"></i>
  </button>
  <button pButton type="button" variant="text" severity="danger" [rounded]="true" class="item-card__delete"
          pTooltip="Usuń" tooltipPosition="top" [attr.aria-label]="'Usuń ' + item().name" (click)="delete()">
    <i class="pi pi-trash" aria-hidden="true"></i>
  </button>
</div>
