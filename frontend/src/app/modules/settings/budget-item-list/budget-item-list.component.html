<div class="item-list animation-stagger-children">
  @for (item of sortedItems(); track item.id) {
    <app-budget-item-card [item]="item" [kind]="kind()"/>
  }
  <button type="button" class="item-list__add" (click)="create()">
    <i class="pi pi-plus" aria-hidden="true"></i>
    {{ addLabel() }}
  </button>
</div>
