<p class="muted recurring__intro">
  Pensje, czynsz, rachunki czy stała wpłata na cel — ustaw je raz, a każdego miesiąca w wybranym dniu same pojawią się w budżecie.
  Każdą tak dodaną transakcję możesz potem poprawić albo usunąć jak zwykłą.
</p>

<div class="flex flex-col gap-8 recurring animation-stagger-children">
  @for (recurring of store.recurringTransactions(); track recurring.id) {
    <app-recurring-transaction-card [recurring]="recurring"/>
  }
  <button type="button" class="recurring__add" (click)="store.create()">
    <i class="pi pi-plus" aria-hidden="true"></i>
    Dodaj stałą transakcję
  </button>
</div>

<app-recurring-transaction-editor/>
