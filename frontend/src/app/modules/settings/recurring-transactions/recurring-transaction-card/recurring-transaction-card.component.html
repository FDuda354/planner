<div class="recurring-card" [class.recurring-card--inactive]="!recurring().active">
  <button type="button" class="recurring-card__main" (click)="edit()">
    <ui-item-icon class="recurring-card__icon" [icon]="item()?.icon ?? 'pi-question'" [color]="item()?.color ?? '#94a3b8'"/>
    <span class="recurring-card__title">
      {{ recurring().note || itemName() }}
      <span class="meta-badge meta-badge--frequency recurring-card__frequency">
        <i [class]="isYearly() ? 'pi pi-calendar' : 'pi pi-sync'" aria-hidden="true"></i>{{ isYearly() ? 'roczna' : 'miesięczna' }}
      </span>
    </span>
    <span class="flex flex-row flex-wrap items-center recurring-card__meta">
      @if (isAssignedToMember()) {
        <span class="flex flex-row items-center gap-4">
          <ui-member-avatar [member]="member()" size="xs"/>
          {{ member()?.firstName }}
          <span aria-hidden="true">·</span>
        </span>
      }
      <span>{{ schedule() }} <span aria-hidden="true">·</span></span>
      @if (recurring().active) {
        <span>następna {{ recurring().nextOccurrence | date: nextOccurrenceFormat() }}</span>
      } @else {
        <span>wstrzymana</span>
      }
      @if (recurring().shared) {
        <span class="meta-badge meta-badge--shared"><i class="pi pi-home" aria-hidden="true"></i>dobro wspólne</span>
      }
    </span>
    <span class="amount recurring-card__amount" [class]="'amount--' + recurring().type.toLowerCase()">
      {{ sign() }}{{ recurring().amount | money }}
    </span>
  </button>
  <div class="flex flex-row items-center gap-12 recurring-card__actions">
    <p-toggleswitch [formField]="activeForm.active"
                    (onChange)="toggleActive()"
                    [pTooltip]="recurring().active ? 'Wstrzymaj' : 'Wznów'"
                    tooltipPosition="top"
                    [ariaLabel]="(recurring().active ? 'Wstrzymaj ' : 'Wznów ') + itemName()"/>
    <button pButton type="button" variant="text" severity="danger" [rounded]="true" class="recurring-card__delete"
            pTooltip="Usuń" tooltipPosition="top" [attr.aria-label]="'Usuń cykliczną transakcję ' + itemName()" (click)="delete()">
      <i class="pi pi-trash" aria-hidden="true"></i>
    </button>
  </div>
</div>
