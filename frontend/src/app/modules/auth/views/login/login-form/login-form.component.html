<form class="auth-form" [formRoot]="loginForm" (submit)="login($event)">
  <div class="auth-form__header">
    <h1 class="auth-form__title">Witaj z powrotem</h1>
    <p class="auth-form__subtitle">Zaloguj się do wspólnego budżetu</p>
  </div>

  <div class="auth-form__body">
    <label class="auth-form__label" for="login-email">E-mail</label>
    <input pInputText
           id="login-email"
           type="email"
           placeholder="ty@example.com"
           class="auth-form__input"
           [pAutoFocus]="true"
           [formField]="loginForm.email"
           (change)="trimEmail()"
           autocomplete="username"/>
    <ui-field-error [field]="loginForm.email"/>

    <label class="auth-form__label" for="login-password">Hasło</label>
    <p-iconfield>
      <input pInputPassword
             id="login-password"
             placeholder="••••••••"
             class="auth-form__input"
             [mask]="passwordMasked()"
             [formField]="loginForm.password"
             autocomplete="current-password"/>
      <p-inputicon>
        <button type="button" class="input-icon-button"
                [attr.aria-label]="passwordMasked() ? 'Pokaż hasło' : 'Ukryj hasło'"
                (click)="passwordMasked.set(!passwordMasked())">
          <i [class]="passwordMasked() ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
        </button>
      </p-inputicon>
    </p-iconfield>
    <ui-field-error [field]="loginForm.password"/>

    @if (errorMessage()) {
      <p-message severity="error">{{ errorMessage() }}</p-message>
    }
  </div>

  <button pButton
          class="auth-form__submit action-button--solid"
          type="submit"
          [disabled]="isWorking()"
          [attr.aria-busy]="isWorking()">
    @if (isWorking()) {
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
    }
    Zaloguj się
  </button>

  <p class="auth-form__switch">
    Nie masz jeszcze konta?
    <button type="button" class="auth-form__link" (click)="switchToRegister.emit()">Załóż je</button>
  </p>
</form>
